<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<title>实时语音识别</title>

<style>

body{
    background:#111;
    color:#eee;
    font-family:Consolas;
    padding:20px;
}

#container{
    max-width:1000px;
    margin:auto;
}

#liveBox{
    border:1px solid #333;
    border-radius:10px;
    padding:20px;
    margin-bottom:30px;
    min-height:80px;
}

#liveTitle{
    color:#888;
    margin-bottom:10px;
}

#liveText{
    font-size:28px;
    color:#aaa;
    line-height:1.5;
}

#history{
    margin-top:20px;
}

.msg{
    margin-bottom:14px;
    padding:12px;
    border-radius:10px;
    background:#1b1b1b;
}

.final{
    color:#00ff88;
}

.speaker{
    color:#66ccff;
    font-weight:bold;
}

.time{
    color:#777;
    font-size:12px;
    margin-right:10px;
}

</style>

</head>

<body>

<div id="container">

<h2>实时语音识别</h2>

<div id="liveBox">

<div id="liveTitle">
正在识别
</div>

<div id="liveText"></div>

</div>

<div id="history"></div>

</div>

<script>

const ws = new WebSocket(
    "ws://127.0.0.1:8000/ws/frontend"
)

const liveText =
    document.getElementById("liveText")

const history =
    document.getElementById("history")

function nowTime(){

    const d = new Date()

    return d.toLocaleTimeString()
}

function scrollBottom(){

    window.scrollTo(
        0,
        document.body.scrollHeight
    )
}

function appendFinal(text, speaker){

    const div = document.createElement("div")

    div.className = "msg final"

    div.innerHTML = `
        <span class="time">
            ${nowTime()}
        </span>

        <span class="speaker">
            [${speaker}]
        </span>

        ${text}
    `

    history.appendChild(div)

    scrollBottom()
}

ws.onmessage = (event)=>{

    const data = JSON.parse(event.data)

    // =====================================
    // partial
    // =====================================

    if(data.type === "partial"){

        liveText.innerHTML = `
            <span class="speaker">
                [${data.speaker}]
            </span>

            ${data.text}
        `
    }

    // =====================================
    // final
    // =====================================

    else if(data.type === "final"){

        appendFinal(
            data.text,
            data.speaker
        )

        // 清空实时区域
        liveText.innerHTML = ""
    }
}

</script>

</body>

</html>
