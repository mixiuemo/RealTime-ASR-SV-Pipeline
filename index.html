<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 语音调度监控台 - 状态机版</title>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #1a1a1a; color: #e0e0e0; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1100px; }
        .header { border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .status-dot { width: 10px; height: 10px; background: #4caf50; border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 5px #4caf50; }
        
        #chat-flow { height: 80vh; overflow-y: auto; background: #252526; border-radius: 12px; padding: 20px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); border: 1px solid #333; }
        
        .message-row { margin-bottom: 25px; animation: slideIn 0.3s ease; position: relative; border-bottom: 1px solid #2d2d2d; padding-bottom: 15px; }
        .channel-tag { position: absolute; right: 10px; top: 0; font-size: 11px; color: #555; font-family: monospace; }
        
        .speaker-tag { font-size: 14px; color: #888; margin-bottom: 8px; display: flex; align-items: center; font-weight: 500; }
        .speaker-tag.identified { color: #4ec9b0; font-weight: bold; } 
        .speaker-tag.operator { color: #569cd6; }
        .speaker-tag i { font-style: normal; margin-right: 8px; }
        
        /* 分值角标样式 */
        /* 精细化分值角标 */
        .score-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 10px;
            font-family: monospace;
        }

        /* 根据置信度分级 */
        .trust-extreme { background: #1b5e20; color: #c8e6c9; border: 1px solid #4caf50; } /* 极高 > 0.75 */
        .trust-high { background: #2e7d32; color: #ffffff; border: 1px solid #81c784; }    /* 高 0.55-0.75 */
        .trust-mid { background: #f57f17; color: #fffde7; border: 1px solid #fbc02d; }     /* 模糊 0.45-0.55 */
        .trust-low { background: #333333; color: #888888; border: 1px solid #555555; }     /* 陌生人 < 0.45 */

        .bubble { display: inline-block; padding: 12px 18px; border-radius: 4px 16px 16px 16px; line-height: 1.6; max-width: 92%; font-size: 16px; transition: all 0.2s ease; }
        .preview { background: #333333; color: #aaa; border-left: 4px solid #666; font-style: italic; }
        .truncate { background: #3e3e42; color: #e0e0e0; border-left: 4px solid #ffeb3b; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .final { background: #2d2d30; color: #ffffff; border-left: 4px solid #4ec9b0; box-shadow: 0 6px 15px rgba(0,0,0,0.4); }

        #chat-flow::-webkit-scrollbar { width: 6px; }
        #chat-flow::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div style="font-size: 22px; font-weight: bold; color: #4ec9b0;">🚀 AI 语音调度实时监控台</div>
        <div style="font-size: 14px; color: #888;">
            <span class="status-dot" id="ws-status"></span> 
            状态: <span id="status-text">正在连接...</span> | 
            路数: <span id="conn-count">0</span>
        </div>
    </div>
    <div id="chat-flow">
        <div id="empty-hint" style="color: #666; font-size: 14px; text-align: center; margin-top: 250px;">等待语音流输入...</div>
    </div>
</div>

<script>
    // 🚩 注意：Python 同步 server 默认不需要 /ws 路径
    const socket = new WebSocket('ws://localhost:8081'); 
    const chatFlow = document.getElementById('chat-flow');
    const connCountDisp = document.getElementById('conn-count');
    const wsStatusDot = document.getElementById('ws-status');
    const wsStatusText = document.getElementById('status-text');

    // 为每一路 channel 维护状态
    const channelMap = new Map();

    socket.onopen = () => {
        wsStatusDot.style.background = "#4caf50";
        wsStatusDot.style.boxShadow = "0 0 8px #4caf50";
        wsStatusText.innerText = "已连接";
    };

    socket.onclose = () => {
        wsStatusDot.style.background = "#f44336";
        wsStatusDot.style.boxShadow = "0 0 8px #f44336";
        wsStatusText.innerText = "连接断开";
    };

    socket.onmessage = function(event) {
        try {
            const data = JSON.parse(event.data);
            const { type, channel, speaker, text, score } = data;
            
            if (!channelMap.has(channel)) {
                channelMap.set(channel, { lineId: null });
                connCountDisp.innerText = channelMap.size;
            }

            if (type === 'speaker_id') {
                updateSpeakerUI(channel, speaker, false, score);
            } else if (type === 'preview' || type === 'truncate') {
                refreshLine(channel, speaker, text, type, score);
            } else if (type === 'final') {
                refreshLine(channel, speaker, text, 'final', score);
                // 结算后重置该通道，下次起新行
                channelMap.get(channel).lineId = null; 
            }
        } catch (e) { console.error("JSON 解析错误:", e); }
    };

    function refreshLine(channel, speaker, text, type, score) {
        if (document.getElementById('empty-hint')) document.getElementById('empty-hint').remove();

        let state = channelMap.get(channel);
        let line = document.getElementById(state.lineId);

        // 如果该通道没有当前行，或者已经结算，则创建新行
        if (!line) {
            const newLineId = 'line-' + channel + '-' + Date.now();
            state.lineId = newLineId;
            line = createMessageRow(newLineId, channel);
            chatFlow.appendChild(line);
        }

        const bubble = line.querySelector('.bubble');
        bubble.innerText = text;
        
        // 设置样式：preview (灰色), truncate (黄色积木), final (绿色结算)
        bubble.className = 'bubble ' + type;
        
        updateSpeakerUI(channel, speaker, type === 'final', score);
        scrollToBottom();
    }

    function updateSpeakerUI(channel, speaker, isFinal = false, score = 0) {
        let state = channelMap.get(channel);
        const line = document.getElementById(state.lineId);
        if (!line) return;

        const tag = line.querySelector('.speaker-tag');
        
        // 🚩 核心逻辑：根据你的表格判定分级
        let scoreClass = 'trust-low';
        let statusIcon = '🔍';
        let displayName = speaker;

        if (score >= 0.75) {
            scoreClass = 'trust-extreme';
            statusIcon = '🛡️'; // 极高置信度图标
        } else if (score >= 0.55) {
            scoreClass = 'trust-high';
            statusIcon = '👤';
        } else if (score >= 0.45) {
            scoreClass = 'trust-mid';
            statusIcon = '⚠️'; // 风险提醒图标
        }

        const scoreHtml = score > 0 ? `<span class="score-badge ${scoreClass}">${score.toFixed(2)}</span>` : '';

        // 判断展示内容
        if (speaker && !['识别中...', '未知', '陌生人'].includes(speaker)) {
            tag.className = 'speaker-tag identified';
            if(speaker.includes('话务员')) tag.className += ' operator';
            tag.innerHTML = `<i>${statusIcon}</i> ${speaker} ${scoreHtml}`;
        } 
        else if (isFinal) {
            tag.className = 'speaker-tag';
            tag.innerHTML = `<i>👤</i> ${speaker || '未知'} ${scoreHtml}`; 
        }
        else {
            tag.className = 'speaker-tag';
            tag.innerHTML = `<i>🔍</i> 正在辨别身份... ${scoreHtml}`;
        }
    }

    function createMessageRow(id, channel) {
        const div = document.createElement('div');
        div.id = id;
        div.className = 'message-row';
        div.innerHTML = `
            <div class="channel-tag">CHANNEL: ${channel}</div>
            <div class="speaker-tag"><i>🔍</i> 正在辨别身份...</div>
            <div class="bubble preview">...</div>
        `;
        return div;
    }

    function scrollToBottom() { 
        chatFlow.scrollTo({ top: chatFlow.scrollHeight, behavior: 'smooth' }); 
    }
</script>
</body>
</html>
